			.horizontal-next{

				-ms-transform: rotate(-90deg) translate(50%);
			}
			@-webkit-keyframes verticalnext{

				100%{-webkit-transform: translateY(9px);opacity: 1}
			}
			.next img{

				max-height: 100px;
			}
			@-webkit-keyframes horizontalnext{

	        onInit: function(swiper){ //Swiper2.x的初始化是onFirstInit

			},
