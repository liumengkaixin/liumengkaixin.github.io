<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<title>神龙云计算</title>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<link rel="shortcut icon" href="./favicon.ico">
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
		<link href="./assets/bootstrap-3.3.7-dist/css/bootstrap.min.css" rel="stylesheet">
		<link rel="stylesheet" href="./js/Swiper-3.4.2/dist/css/swiper.min.css" />
		<link rel="stylesheet" type="text/css" href="./css/animate.min.css"/>
		<script src="./js/jquery.js"></script>
		<script src="./js/Swiper-3.4.2/dist/js/swiper.min.js" type="text/javascript" charset="utf-8"></script>
		<script src="./js/swiper.animate1.0.2.min.js" type="text/javascript" charset="utf-8"></script>
		<style>
			*{margin: 0; padding: 0;}
			html, body {
		        position: relative;
		        height: 100%;
		    }
		    body {
		        background: #eee;
		        font-family: tahoma,"microsoft yahei","\5FAE\8F6F\96C5\9ED1"!important;
		        font-size: 14px;
		        color:#000;
		        margin: 0;
		        padding: 0;
		    }
		    .swiper-container {
		        width: 100%;
		        height: 100%;
		    }
		    .swiper-slide {
		        text-align: center;
		        font-size: 18px;
		        background: #fff;
		
		        /* Center slide text vertically */
		        display: -webkit-box;
		        display: -ms-flexbox;
		        display: -webkit-flex;
		        display: flex;
		        -webkit-box-pack: center;
		        -ms-flex-pack: center;
		        -webkit-justify-content: center;
		        justify-content: center;
		        -webkit-box-align: center;
		        -ms-flex-align: center;
		        -webkit-align-items: center;
		        align-items: center;
		        font-size:14px;
		        line-height: 24px;
		        color: #fff;
		    }
		    
		    .next{
				position: absolute;
				z-index: 550;
				pointer-events: none;
				display: none;
			}
			.vertical-next{
				left: 50%;
				bottom: 15px;
				transform: translate(-50%);
				-webkit-transform: translate(-50%);
				-ms-transform: translate(-50%);
			}
			.next > div{
				-webkit-animation: verticalnext 1s linear alternate infinite;
				animation: verticalnext 1s linear alternate infinite;
			}
			.horizontal-next{
				top: 50%;
				right: 15px;
				transform: rotate(-90deg) translate(50%);
				-webkit-transform: rotate(-90deg) translate(50%);
				-ms-transform: rotate(-90deg) translate(50%);
			}
			@-webkit-keyframes verticalnext{
				0%{-webkit-transform: translateY(0px);opacity: 0;}
				100%{-webkit-transform: translateY(9px);opacity: 1}
			}
			.next img{
				max-width: 100px;
				max-height: 100px;
			}
			@-webkit-keyframes horizontalnext{
				0%{-webkit-transform: translateX(0px);opacity: 0;}
				100%{-webkit-transform: translateX(9px);opacity: 1}
			}
		    
		    .slide1{background-size: cover; background-position: center; background-image: url(img/bg2/4.jpg);}
		    .slide1 h1{margin-top: 100px;}
		    
		    
		    .line{border-bottom: 1px solid #acb2bd;}
		    .line .title{background: none;}
		</style>
	</head>
	<body>
		<!-- Swiper -->
	    <div class="swiper-container">
	        <div class="swiper-wrapper">
	            <div class="swiper-slide slide1">
	            		<div class="container">
	            			<div style="transform: scale(0.7);">
		            			<div style="margin-top: 2%;"><img src="img/logo.png"/></div>
		            			<div style="margin-top: 4%;"><img src="img/1-2.png"  class="ani" swiper-animate-effect="pulse"/></div>
		            			<div style="margin-top: 60px; color: #acb2bd; line-height: 32px; font-size:20px;" class="ani" swiper-animate-effect="fadeInRight" swiper-animate-duration="0.8s" swiper-animate-delay="0.3s">爱好铁路，航空，无线电，气象，天文观测，软路由，动漫，航天，EVE</div>
		            			<div style="margin-top: 60px; color: #acb2bd; line-height: 32px; font-size:20px;" class="ani" swiper-animate-effect="fadeInRight" swiper-animate-duration="0.8s" swiper-animate-delay="0.8s">济局西段 无线电4区 BI4JYQ</div>
	            			</div>
	            		</div> 
	        </div>
	        <!-- Add Pagination -->
	        <div class="swiper-pagination"></div>
	        <!--<div class="next vertical-next" id="next" style="display: block;">
				<div><img src="./img/next.png" alt=""></div>
			</div>-->
	    </div>
	    <!-- Initialize Swiper -->
	    <script>
	    var swiper = new Swiper('.swiper-container', {
	        pagination: '.swiper-pagination',
	        paginationClickable: true,
	        mousewheelControl : true,
	        direction: 'vertical',
	        onInit: function(swiper){ //Swiper2.x的初始化是onFirstInit
			    swiperAnimateCache(swiper); //隐藏动画元素 
			    swiperAnimate(swiper); //初始化完成开始动画
			}, 
			onSlideChangeEnd: function(swiper){ 
			    swiperAnimate(swiper); //每个slide切换结束时也运行当前slide动画
			} 
	    });
	    </script>
	    <div style="display:none;">
		   <script src="" language="JavaScript"></script>
		</div> 
	</body>
</html>
